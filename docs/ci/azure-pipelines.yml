# Copy to azure-pipelines.yml.  The tool installer reads the repository pin.
trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11.9'
      addToPath: true
      architecture: 'x64'

  - script: |
      python -m venv .venv
      .venv/bin/python -m pip install --requirement requirements.txt --constraint requirements.lock
    displayName: Install pinned dependencies

  - script: .venv/bin/python -m pytest
    displayName: Run offline tests
