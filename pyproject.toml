[build-system]
requires = ["setuptools==75.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worksonmymachine"
version = "0.1.0"
description = "Cross-OS reproducibility diagnostics and CleanRoom certification"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
    "rich==13.8.1",
    "click==8.1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worksonmymachine = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.ruff]
line-length = 88

[project.scripts]
worksonmymachine = "worksonmymachine.cli:main"
